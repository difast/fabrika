<!-- Упрощённый знак для кадра 16×16 в favicon.ico.
     Фирменный «<>» на 16 пикселях заплывает в пятно: просвет между шевронами
     закрывается, и знак читается как глаз. Здесь один шеврон и толстая обводка. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#g)"/>
  <g fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M38 17 22 32l16 15"/>
  </g>
</svg>
